<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a new account to access the platform." />
  <title>Register — Role-Based Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="centered">
  <div class="card login-card">
    <h1>Create an Account</h1>
    <p class="muted" style="margin-bottom:1.5rem;">
      Self-registration creates a <strong>user</strong> account.
    </p>

    <form id="registerForm" autocomplete="off">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Juan Dela Cruz" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@lab.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required />
      </div>
      <div class="field" style="margin-bottom:1.25rem;">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Re-type password" required />
      </div>
      <button type="submit" id="submitBtn" class="btn primary">Register</button>
    </form>

    <p id="msg" class="msg"></p>

    <div class="hint">
      Already have an account? <a href="/login.html">Sign in here</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const msg  = document.getElementById('msg');
    const btn  = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      if (!name) {
        msg.textContent = 'Please enter your full name.';
        msg.className = 'msg error';
        return;
      }
      if (!email.includes('@')) {
        msg.textContent = 'Please enter a valid email address.';
        msg.className = 'msg error';
        return;
      }
      if (password.length < 6) {
        msg.textContent = 'Password must be at least 6 characters.';
        msg.className = 'msg error';
        return;
      }
      if (password !== confirm) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        const res  = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Registration failed.';
          msg.className = 'msg error';
          return;
        }

        msg.textContent = 'Registration successful! Redirecting to login...';
        msg.className = 'msg success';
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      } catch {
        msg.textContent = 'Cannot reach the server. Is it running?';
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
