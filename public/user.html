<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="User Dashboard" />
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="topbar-meta">
        <h1>Dashboard</h1>
        <span class="badge-role user">User</span>
      </div>
      <button id="logoutBtn" class="btn danger">Sign out</button>
    </header>

    <div class="card">
      <p class="welcome">Signed in as <strong id="userName"></strong></p>
      <p class="muted" id="userEmail"></p>
    </div>

    <div class="card">
      <h2>Account</h2>
      <ul class="tool-list" style="margin-top:.5rem;">
        <li>View your profile</li>
        <li>Browse activity feed</li>
        <li>Manage notifications</li>
      </ul>
      <p class="notice">To change your role, contact an administrator.</p>
    </div>
  </div>

  <script>
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role !== 'user') {
      window.location.href = '/login.html';
    } else {
      document.getElementById('userName').textContent  = currentUser.name;
      document.getElementById('userEmail').textContent = currentUser.email;
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('currentUser');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
